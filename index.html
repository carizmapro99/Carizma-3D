<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Carizma 3D Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06080d;
    --glass: rgba(16, 22, 34, 0.78);
    --glass-card: rgba(24, 33, 50, 0.62);
    --border: rgba(148, 163, 184, 0.16);
    --accent: #38bdf8;
    --teal: #2dd4bf;
    --danger: #f43f5e;
    --text: #f8fafc;
    --muted: #94a3b8;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
  }

  /* App Shell */
  .app {
    display: flex; flex-direction: column; width: 100%; height: 100dvh;
    padding-top: var(--safe-t);
  }

  /* Clean Compact Top Bar */
  header {
    height: 52px; padding: 0 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; flex-shrink: 0; }
  .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, rgba(45,212,191,0.2), rgba(56,189,248,0.2));
    border: 1px solid rgba(45,212,191,0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .scene-sel {
    flex: 1; min-width: 0; max-width: 240px;
    background: rgba(8, 12, 20, 0.8); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 6px 10px; font-family: inherit; font-size: 12px; outline: none;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 7px 12px; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--text); background: var(--glass-card); border: 1px solid var(--border);
    cursor: pointer; transition: 0.15s; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: linear-gradient(135deg, #0ea5e9, #2dd4bf);
    color: #04131c; border-color: transparent; font-weight: 700;
  }
  .btn.active { background: rgba(56,189,248,0.24); border-color: var(--accent); color: #e0f2fe; }
  .btn.danger { color: #fda4af; border-color: rgba(244,63,94,0.35); }
  .btn.sm { padding: 5px 9px; font-size: 11px; border-radius: 8px; }

  /* Main Stage — Takes ALL remaining screen space! */
  main {
    flex: 1; position: relative; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #0f172a 0%, #06080d 75%);
  }
  .stage-shell {
    position: relative; width: 100%; height: 100%;
    overflow: hidden; background: #05070a;
    transition: width 0.2s ease, height 0.2s ease;
  }
  iframe#scene-frame { width: 100%; height: 100%; border: none; display: block; }

  /* Overlays */
  .ov-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: none; }
  #plate-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0.5; }
  #sz-layer { border: 2px dashed rgba(45,212,191,0.5); }
  .sz-t { position: absolute; top:0; left:0; right:0; height:14%; background:rgba(244,63,94,0.16); border-bottom:1px dashed rgba(244,63,94,0.6); }
  .sz-b { position: absolute; bottom:0; left:0; right:0; height:35%; background:rgba(244,63,94,0.16); border-top:1px dashed rgba(244,63,94,0.6); }
  .sz-r { position: absolute; top:14%; bottom:35%; right:0; width:14%; background:rgba(251,191,36,0.12); border-left:1px dashed rgba(251,191,36,0.5); }
  #grid-layer {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.18) 1px, transparent 1px);
    background-size: 33.333% 33.333%;
  }

  /* Floating Capture Pill (Top-Left of Viewport) */
  .fab-capture {
    position: absolute; top: 10px; left: 10px; z-index: 20;
    display: flex; gap: 6px;
  }

  /* Slide-up Glass Drawer (Mobile & Desktop clean tool sheet) */
  .drawer {
    position: fixed; left: 0; right: 0; bottom: calc(58px + var(--safe-b));
    max-height: 62dvh; overflow-y: auto; z-index: 40;
    background: rgba(13, 19, 30, 0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid rgba(148,163,184,0.22); border-radius: 20px 20px 0 0;
    padding: 14px 16px 18px; display: none; flex-direction: column; gap: 12px;
    box-shadow: 0 -16px 40px rgba(0,0,0,0.65);
  }
  .drawer.open { display: flex; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; }
  .drawer-head h3 { font-size: 13.5px; color: var(--accent); font-weight: 700; }

  .row { display: flex; align-items: center; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  input[type="text"], textarea {
    width: 100%; background: rgba(6, 9, 15, 0.85); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-family: inherit; font-size: 12.5px; outline: none;
  }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .code-box {
    min-height: 170px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
    direction: ltr; text-align: left; resize: vertical;
  }
  .val { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--teal); min-width: 34px; text-align: left; }

  /* Storyboard Strip inside Drawer */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
  .thumb {
    position: relative; height: 96px; min-width: 58px; border-radius: 9px; overflow: hidden;
    border: 1px solid var(--border); background: #090d14; flex-shrink: 0;
  }
  .thumb img { height: 100%; width: auto; display: block; }
  .thumb .tag {
    position: absolute; bottom: 3px; left: 3px; background: rgba(0,0,0,0.78);
    color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono', monospace;
  }
  .thumb .del {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(244,63,94,0.9); color: #fff; border: none; font-size: 12px; cursor: pointer;
  }

  /* Bottom iOS-style Navigation Bar */
  nav.bottom-bar {
    height: calc(58px + var(--safe-b)); padding-bottom: var(--safe-b); flex-shrink: 0;
    background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-top: 1px solid var(--border); z-index: 50;
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .nav-item {
    background: none; border: none; color: var(--muted); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 10.5px; font-weight: 600; cursor: pointer; transition: 0.15s;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item .badge {
    background: var(--teal); color: #04131c; font-size: 9px; font-weight: 800;
    padding: 0 5px; border-radius: 99px; margin-right: 3px;
  }

  /* Sheet Preview Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(2,6,14,0.84); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    width: 100%; max-width: 680px; max-height: 88dvh; background: #0e1420;
    border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .modal-h, .modal-f { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .modal-f { border-bottom: none; border-top: 1px solid var(--border); justify-content: flex-end; gap: 8px; }
  .modal-b { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  #sheet-canvas { max-width: 100%; max-height: 56dvh; margin: 0 auto; border-radius: 10px; display: block; }

  #toast {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-10px);
    background: rgba(15,23,42,0.95); border: 1px solid var(--accent); color: #e0f2fe;
    padding: 7px 14px; border-radius: 99px; font-size: 11.5px; opacity: 0; pointer-events: none;
    transition: 0.2s; z-index: 200; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Desktop enhancement: centered floating drawer */
  @media (min-width: 860px) {
    .drawer { max-width: 520px; left: 50%; transform: translateX(-50%); border-radius: 18px; bottom: 72px; border: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2.2">
          <path d="M12 3c-2 4-3 7-3 10a3 3 0 0 0 6 0c0-3-1-6-3-10Z"/>
          <path d="M12 13c-3-1-6-3-8-6 0 4 2 8 8 10 6-2 8-6 8-10-2 3-5 5-8 6Z"/>
        </svg>
      </div>
      <span>Carizma 3D</span>
    </div>
    <select id="scene-sel" class="scene-sel" onchange="selectScene(this.value)"></select>
    <button class="btn sm primary" onclick="openDrawer('code')">+ کد</button>
  </header>

  <main id="main-stage">
    <div class="stage-shell" id="stage-shell">
      <iframe id="scene-frame" allow="fullscreen"></iframe>

      <div class="ov-layer" id="plate-layer"><img id="plate-img" alt="plate" /></div>
      <div class="ov-layer" id="sz-layer"><div class="sz-t"></div><div class="sz-r"></div><div class="sz-b"></div></div>
      <div class="ov-layer" id="grid-layer"></div>

      <div class="fab-capture">
        <button class="btn sm primary" onclick="captureFrame()">ثبت پنل</button>
      </div>
    </div>
  </main>

  <!-- Drawer 1: Frame & Calibration -->
  <div class="drawer" id="drawer-cal">
    <div class="drawer-head">
      <h3>کادر، راهنما و کالیبراسیون پلیت</h3>
      <button class="btn sm" onclick="closeDrawers()">بستن ✕</button>
    </div>
    <div class="grid-3">
      <button class="btn sm active" id="asp-fill" onclick="setAspect('fill')">کامل</button>
      <button class="btn sm" id="asp-916" onclick="setAspect('9:16')">۹:۱۶ ریلز</button>
      <button class="btn sm" id="asp-169" onclick="setAspect('16:9')">۱۶:۹ واید</button>
    </div>
    <div class="grid-2">
      <button class="btn sm" id="btn-sz" onclick="toggleGuide('sz')">Safe Zone 9:16</button>
      <button class="btn sm" id="btn-grid" onclick="toggleGuide('grid')">یک‌سوم طلایی</button>
    </div>
    <div class="grid-2">
      <button class="btn sm" onclick="document.getElementById('plate-in').click()">آپلود عکس پلیت</button>
      <button class="btn sm" id="btn-ov" onclick="togglePlate()">Overlay: خاموش</button>
    </div>
    <input type="file" id="plate-in" accept="image/*" style="display:none" onchange="onPlateFile(event)" />
    <div class="row">
      <span style="font-size:11px;color:var(--muted)">شفافیت</span>
      <input type="range" id="ov-op" min="0" max="1" step="0.05" value="0.5" oninput="updateOv()" />
      <span class="val" id="ov-op-v">50%</span>
    </div>
    <div class="row">
      <span style="font-size:11px;color:var(--muted)">برش مقایسه</span>
      <input type="range" id="ov-sp" min="0" max="100" step="1" value="100" oninput="updateOv()" />
      <span class="val" id="ov-sp-v">100%</span>
    </div>
  </div>

  <!-- Drawer 2: Storyboard Panels -->
  <div class="drawer" id="drawer-sb">
    <div class="drawer-head">
      <h3>خروجی و استوری‌بورد (<span id="sb-cnt">0</span> پنل)</h3>
      <button class="btn sm" onclick="closeDrawers()">بستن ✕</button>
    </div>
    <div class="grid-2">
      <button class="btn sm active" id="mode-single" onclick="setSaveMode('single')">حالت: ذخیره تک‌تک</button>
      <button class="btn sm" id="mode-sheet" onclick="setSaveMode('sheet')">حالت: ذخیره پنلی (شیت)</button>
    </div>
    <div class="row">
      <input type="text" id="cap-lbl" value="P1 · 0.0s" placeholder="برچسب پنل" />
      <button class="btn primary" id="btn-cap-action" onclick="handleCaptureButton()">ذخیره تک PNG</button>
    </div>
    <div class="strip" id="sb-strip">
      <div style="font-size:11.5px;color:var(--muted);padding:12px">هنوز پنلی ثبت نشده است.</div>
    </div>
    <div class="grid-2">
      <button class="btn sm" onclick="document.getElementById('imp-png').click()">+ افزودن PNG</button>
      <button class="btn sm primary" onclick="openSheet()">ساخت شیت پنلی ۳×۲</button>
    </div>
    <input type="file" id="imp-png" accept="image/*" multiple style="display:none" onchange="importPngs(event)" />
  </div>

  <!-- Drawer 3: Paste / Upload Code -->
  <div class="drawer" id="drawer-code">
    <div class="drawer-head">
      <h3>جاگذاری کد یا فایل HTML / Three.js</h3>
      <button class="btn sm" onclick="closeDrawers()">بستن ✕</button>
    </div>
    <div class="grid-2">
      <button class="btn sm" onclick="document.getElementById('html-in').click()">انتخاب فایل .html</button>
      <button class="btn sm danger" onclick="deleteScene()">حذف صحنه فعلی</button>
    </div>
    <input type="file" id="html-in" accept=".html,.htm,.txt" style="display:none" onchange="onHtmlFile(event)" />
    <input type="text" id="sc-name" placeholder="نام صحنه (مثلاً صحنه ۳ — دادگاه)" />
    <textarea id="sc-code" class="code-box" placeholder="کد HTML را اینجا Paste کن..."></textarea>
    <button class="btn primary" onclick="saveNewScene()">ذخیره و اجرای زنده</button>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-bar">
    <button class="nav-item active" id="nav-view" onclick="closeDrawers()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      <span>صحنه 3D</span>
    </button>
    <button class="nav-item" id="nav-cal" onclick="openDrawer('cal')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>کالیبراسیون</span>
    </button>
    <button class="nav-item" id="nav-sb" onclick="openDrawer('sb')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/></svg>
      <span>استوری‌بورد <span class="badge" id="nav-cnt">0</span></span>
    </button>
    <button class="nav-item" id="nav-code" onclick="openDrawer('code')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span>کد / فایل</span>
    </button>
  </nav>
</div>

<!-- Sheet Export Modal -->
<div class="modal-bg" id="sheet-modal">
  <div class="modal">
    <div class="modal-h">
      <strong style="font-size:13.5px;color:var(--accent)">شیت نهایی استوری‌بورد</strong>
      <button class="btn sm" onclick="document.getElementById('sheet-modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-b">
      <div class="row">
        <button class="btn sm active" id="c3" onclick="setCols(3)">۳ ستون (۳×۲)</button>

      </div>
      <canvas id="sheet-canvas" style="display:none"></canvas>
      <img id="sheet-preview-img" alt="Storyboard Sheet" style="max-width:100%;max-height:54dvh;margin:0 auto;border-radius:10px;display:block;-webkit-touch-callout:default;" />
      <div style="font-size:11px;color:var(--muted);text-align:center">در آیفون: دکمه زیر را بزن یا انگشتت را روی عکس نگه دار و Save to Photos بزن</div>
    </div>
    <div class="modal-f">
      <button class="btn primary" onclick="downloadSheet()">ذخیره / دانلود PNG شیت</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const DEFAULT_SCENE = `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />

<title>Scene 2 — Bakery 3D (Rigged Mannequin)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07090e; color: #f1f5f9; }
  #canvas-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

    display: flex; gap: 6px; overflow-x: auto; padding: 6px 8px;
    background: rgba(12, 17, 27, 0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 14px;
    scrollbar-width: none;
  }
  #preset-bar::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; background: rgba(255,255,255,0.07); color: #e2e8f0;

  .pill.active {

    color: #04131c; font-weight: 700; border-color: transparent;
  }
  #hud-desc {
    position: fixed; top: 44px; left: 10px; right: 10px; z-index: 9; pointer-events: none;

  }
  #hud-desc span {
    background: rgba(10, 14, 22, 0.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 99px;
    padding: 4px 12px; font-size: 10.5px; color: #e2e8f0; max-width: 96%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    unicode-bidi: isolate; text-align: center;

</style>

<body>

<div id="canvas-wrap"></div>
<div id="preset-bar">
  <button class="pill" id="b-CAM_PLATE" onclick="selectPreset('CAM_PLATE')">پلیت تنور</button>
  <button class="pill" id="b-CAM_DOOR" onclick="selectPreset('CAM_DOOR')">دیوار در</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>

<script>
const wrap = document.getElementById('canvas-wrap');
const descEl = document.getElementById('desc');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16110e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 60);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const STORE = 'carizma_3d_v6_scenes';

function setSaveMode(mode) {

  document.getElementById('mode-sheet').classList.toggle('active', mode === 'sheet');
  document.getElementById('btn-cap-action').textContent = mode === 'single' ? 'ذخیره تک PNG' : '+ ثبت پنل';

async function exportBlobOrDataUrl(dataUrl, filename) {
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const file = new File([blob], filename, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: filename });
      toast('ذخیره شد: ' + filename);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('دانلود شد: ' + filename);
}

async function handleCaptureButton() {
  const url = captureFrame();
  if (!url) return;
  if (saveMode === 'single') {
    const rawLbl = document.getElementById('cap-lbl').value.trim() || ('panel_' + panels.length);
    const safeName = rawLbl.replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'panel';
    await exportBlobOrDataUrl(url, safeName + '.png');
  }
}

function downloadSinglePanel(id) {
  const p = panels.find(x => x.id === id);
  if (!p) return;
  const safeName = (p.label || 'panel').replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'panel';
  exportBlobOrDataUrl(p.url, safeName + '.png');
}

function toast(m) {

function patchCode(html) {
  const baseHref = window.location.href.replace(/[^/]*$/, '');
  const baseTag = `<base href="${baseHref}">`;
  const patch = baseTag + `<script>(function(){const o=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,a){if(t&&t.includes('webgl'))a=Object.assign({},a||{},{preserveDrawingBuffer:true});return o.call(this,t,a);};})();<\/script>`;
  return html.includes('<head>') ? html.replace('<head>', '<head>' + patch) : patch + html;
}

function captureFrame() {

  ev.target.value = '';
}

function removePanel(id) { panels = panels.filter(p => p.id !== id); renderPanels(); }

function renderPanels() {
  document.getElementById('sb-cnt').textContent = panels.length;
  document.getElementById('nav-cnt').textContent = panels.length;
  const st = document.getElementById('sb-strip');
  if (!panels.length) { st.innerHTML = '<div style="font-size:11.5px;color:var(--muted);padding:12px">هنوز پنلی ثبت نشده است.</div>'; return; }
  st.innerHTML = '';
  panels.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'thumb';
    d.innerHTML = `<img src="${p.url}"><span class="tag">${i+1} · ${p.label}</span><button class="del" onclick="removePanel(${p.id})">×</button><button class="del" style="top:3px;left:3px;right:auto;background:rgba(14,165,233,0.9)" onclick="downloadSinglePanel(${p.id})" title="دانلود تک PNG">↓</button>`;
    st.appendChild(d);
  });
}

function setCols(c) {
  sheetCols = c;
  document.getElementById('c3').classList.toggle('active', c===3);
  document.getElementById('c2').classList.toggle('active', c===2);
  buildSheet();
}
function openSheet() {
  if (!panels.length) { toast('اول حداقل یک پنل ثبت کن'); return; }
  document.getElementById('sheet-modal').classList.add('open');
  buildSheet();
}
async function buildSheet() {
  const PW=540, PH=960, GAP=8, cols=sheetCols, rows=Math.ceil(panels.length/cols);
  const cv = document.getElementById('sheet-canvas');
  cv.width = cols*PW+(cols+1)*GAP; cv.height = rows*PH+(rows+1)*GAP;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#c8c8c8'; ctx.fillRect(0,0,cv.width,cv.height);
  for (let i=0; i<panels.length; i++) {
    const im = await new Promise(res => { const img = new Image(); img.onload=()=>res(img); img.src=panels[i].url; });
    const x = GAP + (i%cols)*(PW+GAP), y = GAP + Math.floor(i/cols)*(PH+GAP);
    const sr = im.width/im.height, dr = PW/PH;
    let sx=0, sy=0, sw=im.width, sh=im.height;
    if (sr > dr) { sw = im.height*dr; sx = (im.width-sw)/2; } else { sh = im.width/dr; sy = (im.height-sh)/2; }
    ctx.drawImage(im, sx, sy, sw, sh, x, y, PW, PH);
    const txt = `${i+1} · ${panels[i].label}`;
    ctx.direction = 'ltr';
    ctx.textAlign = 'left';
    ctx.font = 'bold 28px JetBrains Mono, Arial, sans-serif';
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(x, y, tw+24, 46);
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x+12, y+24);
  }
  _syncSheetImg();
}
let _lastSheetBlob = null;
function _syncSheetImg() {
  const cv = document.getElementById('sheet-canvas');
  cv.toBlob(blob => {
    _lastSheetBlob = blob;
    const imgEl = document.getElementById('sheet-preview-img');
    if (imgEl.dataset.url) URL.revokeObjectURL(imgEl.dataset.url);
    const u = URL.createObjectURL(blob);
    imgEl.dataset.url = u;
    imgEl.src = u;
  }, 'image/png');
}

async function downloadSheet() {
  const cv = document.getElementById('sheet-canvas');
  const blob = _lastSheetBlob || await new Promise(res => cv.toBlob(res, 'image/png'));
  if (!blob) { toast('خطا در ساخت عکس'); return; }
  const file = new File([blob], 'carizma_storyboard_sheet.png', { type: 'image/png' });

  // iOS Safari / PWA native Share Sheet (Save Image to Photos)
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Carizma Storyboard Sheet' });
      toast('ذخیره شد!');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }

  // Desktop / Android fallback via Blob URL
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'carizma_storyboard_sheet.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('شیت دانلود شد!');
}

init();
</script>
